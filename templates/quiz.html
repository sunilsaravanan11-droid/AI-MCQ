{% extends "base.html" %}
{% block title %}Quiz · AI MCQ Generator{% endblock %}

{% block content %}
<section class="panel quiz-panel">
  <div class="quiz-header">
    <div class="quiz-topic-tag">{{ quiz['topic'] }} &middot; {{ quiz['difficulty'] }}</div>
    <div class="quiz-progress-text"><span id="current-q-num">1</span> / {{ total_questions }}</div>
  </div>

  <div class="progress-bar">
    <div class="progress-bar-fill" id="progress-bar-fill" style="width: {{ (1/total_questions*100) }}%"></div>
  </div>

  <div id="question-container" class="question-container"></div>

  <div class="quiz-nav">
    <button type="button" class="btn btn-secondary" id="prev-btn" disabled>&larr; Previous</button>
    <button type="button" class="btn btn-primary" id="next-btn">Next &rarr;</button>
    <button type="button" class="btn btn-primary" id="submit-btn" style="display:none;">Submit Quiz</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  const QUIZ_ID = {{ quiz['id'] }};
  const QUESTIONS = {{ questions_json | safe }};
  const answers = new Array(QUESTIONS.length).fill(null);
  let currentIndex = 0;

  const questionContainer = document.getElementById('question-container');
  const currentQNum = document.getElementById('current-q-num');
  const progressFill = document.getElementById('progress-bar-fill');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const submitBtn = document.getElementById('submit-btn');

  function renderQuestion(index) {
    const q = QUESTIONS[index];
    const letters = ['A', 'B', 'C', 'D'];

    let html = `<h3 class="question-text">${escapeHtml(q.question)}</h3>`;
    html += '<div class="options-list">';
    q.options.forEach((opt, i) => {
      const selected = answers[index] === i ? 'option-selected' : '';
      html += `
        <label class="option-card ${selected}">
          <input type="radio" name="option" value="${i}" ${answers[index] === i ? 'checked' : ''}>
          <span class="option-letter">${letters[i]}</span>
          <span class="option-text">${escapeHtml(opt)}</span>
        </label>`;
    });
    html += '</div>';

    questionContainer.innerHTML = html;

    questionContainer.querySelectorAll('input[name="option"]').forEach((input, i) => {
      input.addEventListener('change', () => {
        answers[index] = i;
        questionContainer.querySelectorAll('.option-card').forEach(c => c.classList.remove('option-selected'));
        input.closest('.option-card').classList.add('option-selected');
      });
    });

    currentQNum.textContent = index + 1;
    progressFill.style.width = ((index + 1) / QUESTIONS.length * 100) + '%';
    prevBtn.disabled = index === 0;

    if (index === QUESTIONS.length - 1) {
      nextBtn.style.display = 'none';
      submitBtn.style.display = 'inline-flex';
    } else {
      nextBtn.style.display = 'inline-flex';
      submitBtn.style.display = 'none';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion(currentIndex);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < QUESTIONS.length - 1) {
      currentIndex++;
      renderQuestion(currentIndex);
    }
  });

  submitBtn.addEventListener('click', () => {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    fetch(`/submit_quiz/${QUIZ_ID}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: answers })
    })
      .then(res => res.json())
      .then(data => {
        if (data.attempt_id) {
          window.location.href = `/result/${data.attempt_id}`;
        } else {
          alert('Something went wrong submitting the quiz. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Quiz';
        }
      })
      .catch(() => {
        alert('Network error while submitting the quiz. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Quiz';
      });
  });

  renderQuestion(currentIndex);
</script>
{% endblock %}
